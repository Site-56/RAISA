name: Update Halcyon data

on:
  repository_dispatch:
    types: [grant-key, revoke-key, add-file, delete-file, add-request, update-request]

permissions:
  contents: write

concurrency:
  group: halcyon-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Edit data
        env:
          DATA_ACTION: ${{ github.event.action }}
          DATA_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: node scripts/update-data.js
      - name: Commit
        run: |
          git config user.name "halcyon-bot"
          git config user.email "halcyon-bot@users.noreply.github.com"
          git add -A keys.json files.json requests.json
          git commit -m "${{ github.event.action }}"
          git pull --rebase
          git push
