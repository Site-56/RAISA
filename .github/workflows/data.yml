name: Update Halcyon data

on:
  repository_dispatch:
    types: [grant-key, grant-keys, revoke-key, revoke-keys, update-key, add-file, files-batch, delete-file, add-request, update-request, add-department, update-department, remove-department, update-file]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply and save
        env:
          DATA_ACTION: ${{ github.event.action }}
          DATA_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          git config user.name "halcyon-bot"
          git config user.email "halcyon-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/update-data.js
            git add -A keys.json files.json requests.json $(ls -d departments.json files 2>/dev/null)
            git commit -m "$DATA_ACTION" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            echo "Someone else saved first, trying again ($attempt)"
            sleep $((RANDOM % 6 + 2))
          done
          exit 1
